name: B_Navi verified PWA release 2026-11-21
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bnavi-release-20261121.yml
      - .bnavi-release/release.patch.xz.b64
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-release:
    if: github.repository == 'Penta2026/b_navi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply release delta
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'bnavi-pc-pwa-20261121-my-route-library-v1' sw.js; then
            echo 'Release is already applied; skipping.'
            exit 0
          fi
          base64 -d .bnavi-release/release.patch.xz.b64 > /tmp/bnavi-release.patch.xz
          echo '16f96a653ee78b0a0a9d83043c92bdb1f9b0ed9c9e0bdc35ef9b3e966fdf7fff  /tmp/bnavi-release.patch.xz' | sha256sum -c -
          xz -dc /tmp/bnavi-release.patch.xz > /tmp/bnavi-release.patch
          git apply --check /tmp/bnavi-release.patch
          git apply /tmp/bnavi-release.patch
          node --test tests/test_*.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish B_Navi PWA custom routes, named presets, actual-track GPX and My Route library'
          git push origin HEAD:main
