name: B_Navi Node Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check mobile-ui.js
          node --check michinotochu-spot-search.js
          node --check poi-search-merge.js
          node --check place-search-core.js
          node --check map-core.js
          node --check offline-map-download.mjs
          node --check offline-map-bridge.mjs
          node --check offline-map-layer.mjs
          node --check offline-region-mosaic.mjs
      - name: Run B_Navi Node tests
        run: node --test tests/test_*.cjs
      - name: Report old map relay health (diagnostic only)
        continue-on-error: true
        run: |
          node -e "fetch('https://bikenavigator-map-relay.yasutaka5262.workers.dev/health',{signal:AbortSignal.timeout(12000)}).then(r=>r.text()).then(t=>console.log('Map relay health:',t.slice(0,500))).catch(e=>console.log('Map relay unreachable:',e.message))"


  browser-swap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser test dependency
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Tap start-goal swap in an actual Chromium browser
        run: python tests/browser_swap_endpoints.py
